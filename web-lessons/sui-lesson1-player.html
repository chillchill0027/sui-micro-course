<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>隋朝统一与灭亡 · 课堂播放器</title>
<style>
:root{
  --ink:#1d1d1f;--muted:#6e6e73;--sub:#86868b;--blue:#0071e3;
  --bg:#f5f5f7;--card:#fff;--line:rgba(0,0,0,.08);--rail-w:108px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --sui:#c45c26;--zhou:#3d6f8a;--beiqi:#c4a35a;--chen:#2f7d5c;--war:#9a4b1f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%;display:block}
.app{display:grid;grid-template-columns:var(--rail-w) 1fr;height:100vh;width:100vw}

/* rail */
.rail{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0 10px;z-index:5;user-select:none}
.rail-btn{width:36px;height:36px;border-radius:50%;background:var(--bg);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.rail-btn:disabled{opacity:.3;cursor:default}
.rail-btn.next-year{background:var(--blue);color:#fff}
.rail-track{flex:1;width:100%;overflow-y:auto;overflow-x:hidden;padding:10px 8px;scrollbar-width:none;position:relative}
.rail-track::-webkit-scrollbar{display:none}
.rail-track::before{content:"";position:absolute;left:50%;top:18px;bottom:18px;width:2px;background:#e5e5ea;transform:translateX(-50%);z-index:0}
.rail-fill{position:absolute;left:50%;top:18px;width:2px;background:var(--blue);transform:translateX(-50%);z-index:1;height:0;transition:height .35s ease}
.year-node{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0;cursor:pointer}
.year-dot{width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid #d2d2d7;transition:.2s;flex-shrink:0}
.year-node.done .year-dot{border-color:var(--blue);background:var(--blue)}
.year-node.active .year-dot{border-color:var(--blue);background:var(--blue);transform:scale(1.35);box-shadow:0 0 0 4px rgba(0,113,227,.15)}
.year-label{font-size:11px;font-weight:600;color:var(--sub);text-align:center;line-height:1.15}
.year-node.active .year-label{color:var(--blue)}
.year-node.done .year-label{color:var(--ink)}
.rail-brand{font-size:10px;color:var(--sub);text-align:center;padding:8px 4px 0;line-height:1.3}

/* stage */
.stage{position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.stage-top{display:flex;align-items:center;justify-content:space-between;padding:16px 28px 8px;flex-shrink:0}
.stage-kicker{font-size:14px;color:var(--blue);font-weight:600}
.stage-count{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.deck{flex:1;display:flex;overflow:hidden;position:relative;min-height:0}
.slides{display:flex;width:100%;height:100%;transition:transform .45s cubic-bezier(.32,.72,0,1);will-change:transform}
.slide{flex:0 0 100%;width:100%;height:100%;padding:8px 56px 20px;display:flex;min-height:0}
.nav-side{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 12px rgba(0,0,0,.12);font-size:22px;z-index:4;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.nav-side:disabled{opacity:.3;cursor:default}
.nav-side.prev{left:8px}.nav-side.next{right:8px}
.stage-bottom{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 16px;gap:16px}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dots button{width:8px;height:8px;border-radius:50%;background:#d2d2d7;padding:0;transition:.2s}
.dots button.on{width:22px;border-radius:4px;background:var(--ink)}
.hint{font-size:12px;color:var(--sub);white-space:nowrap}

/* cards */
.big-card{background:var(--card);border-radius:28px;box-shadow:0 2px 6px rgba(0,0,0,.04),0 18px 48px rgba(0,0,0,.08);width:100%;height:100%;display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden;min-height:0}
.big-card.no-img{grid-template-columns:1fr}
.big-card.wide-img{grid-template-columns:1.15fr .85fr}
@media (max-width:900px){.big-card,.big-card.wide-img{grid-template-columns:1fr}.slide{padding:8px 48px 16px}}
.big-card .content{padding:32px 36px 28px;overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.big-card .content::-webkit-scrollbar{width:4px}.big-card .content::-webkit-scrollbar-thumb{background:#d2d2d7;border-radius:2px}
.tag{display:inline-flex;align-self:flex-start;font-size:13px;font-weight:500;padding:5px 12px;border-radius:980px;margin-bottom:12px;background:var(--bg);color:var(--muted)}
.tag.book{background:var(--blue);color:#fff}
.tag.extend{background:#424245;color:#f5f5f7}
.tag.cost{background:var(--war);color:#fff}
.tag.map{background:var(--sui);color:#fff}
.year-chip{font-size:14px;font-weight:600;color:var(--blue);margin-bottom:10px}
.big-card h2{font-size:clamp(26px,3vw,38px);font-weight:600;letter-spacing:-.025em;line-height:1.15;margin:0 0 10px}
.big-card .body{font-size:clamp(15.5px,1.3vw,18px);line-height:1.7;flex:1}
.big-card .body p{margin:0 0 .8em}
.big-card .body p:last-child{margin-bottom:0}
.big-card .body strong{font-weight:600}
.big-card .note{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--sub)}
.visual{background:#1d1d1f center/cover no-repeat;min-height:0;position:relative}
.big-card.no-img .visual{display:none}

/* scene */
.scene-slide{align-items:center;justify-content:center}
.chapter-scene{width:100%;max-width:920px;padding:24px 32px}
.scene-eyebrow{font-size:14px;color:var(--blue);font-weight:600;margin-bottom:12px}
.chapter-scene h2{font-size:clamp(34px,5vw,56px);font-weight:600;letter-spacing:-.03em;line-height:1.12;margin:0 0 16px}
.scene-lead{font-size:clamp(17px,1.8vw,22px);color:var(--muted);margin-bottom:36px;line-height:1.5}
.scene-points{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
@media (max-width:800px){.scene-points{grid-template-columns:1fr}}
.scene-point{background:#fff;border-radius:20px;padding:22px 20px;box-shadow:0 1px 3px rgba(0,0,0,.04);opacity:0;transform:translateY(16px);animation:rise .55s ease forwards;animation-delay:calc(var(--order)*.12s+.15s)}
@keyframes rise{to{opacity:1;transform:none}}
.scene-point span{font-size:12px;color:var(--blue);font-weight:600}
.scene-point h3{font-size:20px;margin:6px 0 8px;font-weight:600}
.scene-point p{font-size:14px;color:var(--muted);line-height:1.45}
.scene-prompt{font-size:14px;color:var(--sub)}

/* MAP PAGE */
.map-stage{width:100%;height:100%;display:grid;grid-template-columns:1.3fr .7fr;gap:18px;min-height:0}
@media (max-width:960px){.map-stage{grid-template-columns:1fr}}
.map-panel{background:#fff;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.08);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.map-panel header{padding:16px 20px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.map-panel h2{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
.map-status{font-size:12px;color:var(--sub)}
.map-canvas{flex:1;min-height:0;padding:8px 12px 12px;display:flex;flex-direction:column}
.map-view{flex:1;min-height:200px;background:linear-gradient(160deg,#eef3f7,#e4ebf0);border-radius:16px;overflow:hidden;position:relative}
.map-svg{width:100%;height:100%;display:block;transition:transform .7s cubic-bezier(.32,.72,0,1)}
.map-svg.zoomed{transform:scale(2.2)}
.map-svg .land{fill:#dfe6ec;stroke:#b8c4ce;stroke-width:1.2}
.map-svg .sea{fill:#c5d8e6}
.map-svg .region{fill:#c9d2da;stroke:#fff;stroke-width:1.5;transition:fill .8s ease;cursor:default}
.map-svg .region.zhou{fill:var(--zhou)}
.map-svg .region.beiqi{fill:var(--beiqi)}
.map-svg .region.chen{fill:var(--chen)}
.map-svg .region.sui-fill{fill:var(--sui)}
.map-svg .region.hi{stroke:var(--ink);stroke-width:2}
.map-svg .marker{opacity:0;transition:opacity .5s ease,transform .5s ease;transform-origin:center;transform-box:fill-box}
.map-svg .marker.on{opacity:1}
.map-svg .marker circle{fill:var(--sui);stroke:#fff;stroke-width:2}
.map-svg .marker text{font-size:11px;fill:var(--ink);font-weight:600}
.map-legend{display:flex;flex-wrap:wrap;gap:10px;padding:8px 4px 0;font-size:12px;color:var(--muted)}
.map-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.map-controls{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.btn-pill{padding:9px 16px;border-radius:980px;background:var(--bg);font-size:13px;font-weight:500;transition:.15s}
.btn-pill:hover{background:#e8e8ed}
.btn-pill.primary{background:var(--blue);color:#fff}
.btn-pill.primary:disabled{background:#a0c4ef;cursor:default}
.btn-pill.primary:hover:not(:disabled){background:#0077ED}
.map-side{background:#fff;border-radius:24px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,.08);overflow:auto;min-height:0}
.map-side h3{font-size:18px;margin:0 0 10px;font-weight:600}
.map-side p{font-size:15px;line-height:1.65;color:var(--ink);margin-bottom:.75em}
.map-side .step{display:flex;gap:10px;margin:12px 0;font-size:14px;color:var(--muted);align-items:flex-start}
.map-side .step b{color:var(--blue);font-variant-numeric:tabular-nums;min-width:1.5em}

/* intro */
.intro{position:absolute;inset:0;z-index:20;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.6)),url("assets/hero-sui-capital.png") center/cover no-repeat;color:#f5f5f7;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;transition:opacity .5s,visibility .5s}
.intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.intro h1{font-size:clamp(40px,6vw,72px);font-weight:600;letter-spacing:-.03em;margin:0 0 12px}
.intro .sub{font-size:clamp(18px,2vw,24px);color:#a1a1a6;margin:0 0 8px}
.intro .meta{font-size:14px;color:#86868b;margin:0 0 32px}
.intro .btn{display:inline-flex;padding:14px 32px;border-radius:980px;background:var(--blue);color:#fff;font-size:18px;font-weight:500;box-shadow:0 4px 20px rgba(0,113,227,.35)}
.intro .how{margin-top:24px;font-size:13px;color:#86868b;line-height:1.6}
@media (max-width:640px){:root{--rail-w:72px}.year-label{font-size:10px}.slide{padding:4px 40px 10px}.big-card .content{padding:20px}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="时间进度">
    <button class="rail-btn" id="yearUp" type="button" aria-label="上一节点">↑</button>
    <div class="rail-track" id="railTrack"><div class="rail-fill" id="railFill"></div></div>
    <button class="rail-btn next-year" id="yearDown" type="button" aria-label="下一节点">↓</button>
    <div class="rail-brand">时间<br/>进度</div>
  </aside>
  <main class="stage">
    <div class="stage-top">
      <div class="stage-kicker" id="stageKicker">封面</div>
      <div class="stage-count" id="stageCount">1 / 1</div>
    </div>
    <div class="deck">
      <button class="nav-side prev" id="cardPrev" type="button" aria-label="上一页">‹</button>
      <div class="slides" id="slides"></div>
      <button class="nav-side next" id="cardNext" type="button" aria-label="下一页">›</button>
    </div>
    <div class="stage-bottom">
      <span class="hint">← → 翻页 · ↑ ↓ 换节点</span>
      <div class="dots" id="dots"></div>
      <span class="hint" id="periodHint"></span>
    </div>
    <div class="intro" id="intro">
      <p class="sub" style="color:#f5f5f7;opacity:.9;font-size:16px">人教版七下 · 第一单元 · 第 1 课</p>
      <h1>隋朝统一与灭亡</h1>
      <p class="sub">37 年的王朝 · 千年的遗产</p>
      <p class="meta">581 — 618 · 课堂播放器</p>
      <button class="btn" id="startBtn" type="button">开启这段历史</button>
      <p class="how">地图页：先「修复染色」看全景，再「放大局部」细讲<br/>← → 翻页 · ↑ ↓ 换节点 · 1–9 / 0 跳转</p>
    </div>
  </main>
</div>

<script>
(function(){
  /* ========== 课时节点 ========== */
  const YEARS=[
    {id:"y577",label:"577",caption:"北周灭北齐"},
    {id:"y581",label:"581",caption:"杨坚建隋"},
    {id:"y583",label:"583",caption:"迁都大兴"},
    {id:"y589",label:"589",caption:"灭陈统一"},
    {id:"y604",label:"604",caption:"开皇之治"},
    {id:"y605",label:"605",caption:"炀帝继位"},
    {id:"y607",label:"607",caption:"设进士科"},
    {id:"y610",label:"610",caption:"运河贯通"},
    {id:"y614",label:"612–14",caption:"三征高句丽"},
    {id:"y615",label:"615",caption:"雁门之围"},
    {id:"y618",label:"618",caption:"炀帝落幕"},
    {id:"ySum",label:"总结",caption:"暴政速亡"},
    {id:"yEnd",label:"讨论",caption:"课后活动"}
  ];

  function scene(title,lead,points,eyebrow,prompt){
    return {scene:true,title,lead,points,eyebrow:eyebrow||"阶段概述",prompt:prompt||"沿时间线继续展开。"};
  }

  /* SVG 地图：先全景修复，再局部放大 */
  const MAP_STEPS={
    y577:{
      title:"577 · 北周吞并北齐",
      sideH:"统一前夜的北方",
      sideP:"北周武帝灭北齐，北方基本一体。此时南方仍有陈朝。杨坚出自北周外戚与关陇集团——统一的北方，已经为隋准备好了舞台。",
      legend:[["#3d6f8a","北周（含原北齐）"],["#2f7d5c","陈"],["#c9d2da","其他 / 边地"]],
      focus:"north",
      actionLabel:"染色：北方并入北周",
      zoomLabel:"放大中原",
      steps:["读图例：谁在北方？","577 灭齐 → 北方一体","再看南方陈朝"]
    },
    y581:{
      title:"581 · 隋文帝建立隋朝",
      sideH:"代周建隋",
      sideP:"杨坚夺取北周政权，建立隋朝，仍以长安为都。北方政权换旗，但空间格局仍是「北强南弱」。",
      legend:[["#c45c26","隋"],["#2f7d5c","陈"],["#c9d2da","其他"]],
      focus:"north",
      actionLabel:"染色：北方改旗为隋",
      zoomLabel:"放大关中",
      steps:["581 建隋","仍都长安（关中）","南方仍是陈"]
    },
    y583:{
      title:"583 · 迁都大兴城",
      sideH:"新都与空间坐标",
      sideP:"两年后迁都大兴城。关中是根本，洛阳是枢纽，涿郡是北门，余杭是南粮——这四点后来由大运河缝合。",
      legend:[["#c45c26","隋"],["#2f7d5c","陈"],["#c45c26","● 大兴"]],
      focus:"daxing",
      actionLabel:"标点：大兴城",
      zoomLabel:"放大关中—洛阳",
      steps:["先全景定位大兴","再放大看关中与洛阳关系","为运河叙事铺垫"]
    },
    y589:{
      title:"589 · 过长江，统一陈朝",
      sideH:"分裂的结束",
      sideP:"隋军渡过长江，灭陈，统一全国。意义：结束长期分裂，顺应民族交融，促进南北经济文化交流。",
      legend:[["#c45c26","隋（统一后）"],["#c9d2da","边地"]],
      focus:"all",
      actionLabel:"染色：全国统一",
      zoomLabel:"放大江淮",
      steps:["589 渡江","南方并入隋","统一成为后续建设前提"]
    }
  };

  function mapCard(yearId){
    return {map:true,yearId,title:MAP_STEPS[yearId].title};
  }

  /* ========== 全部页面 ========== */
  const PAGES={
    y577:[
      scene("北周吞并北齐，<br/>北方走到了统一前夜。","577 年，北周灭北齐。分裂中的北方率先完成整合——杨坚将在这个舞台上登场。",[
        ["北方","一体","北周灭北齐"],["格局","北强南弱","南方仍有陈"],["集团","关陇","府兵 · 贵族网络"]
      ],"577 · 地图染色演示"),
      mapCard("y577")
    ],
    y581:[
      scene("581 年，杨坚建隋。<br/>王朝只有 37 年。","从外戚执掌朝政，到代周建隋——统一的接力棒交到了隋文帝手中。",[
        ["581","建隋","杨坚 · 隋文帝"],["都城","长安","关中根本"],["寿命","约 37 年","581—618"]
      ],"581 · 建立隋朝"),
      mapCard("y581"),
      {tag:"book",tagText:"教材",title:"杨坚代周",yearLine:"581 年",body:`<p>北周末年，外戚<strong>杨坚</strong>执掌朝政。581 年，杨坚夺取北周政权，建立隋朝，仍以长安为都，是为隋文帝。</p><p>这次政权更替有此前掌握朝政与平定反对势力的背景，为迅速恢复行政、推进统一创造了条件。</p>`}
    ],
    y583:[
      scene("一座新都，<br/>画出帝国的空间坐标。","583 年迁都大兴城。都城不是风景，而是统治的锚点。",[
        ["关中","根本","大兴城"],["洛阳","枢纽","连接东西"],["南北","待缝合","后来交给运河"]
      ],"583 · 迁都大兴"),
      mapCard("y583"),
      {tag:"book",tagText:"教材",title:"营建并迁都大兴城",yearLine:"582 营建 → 583 迁都",img:"assets/hero-sui-capital.png",body:`<p>建立隋朝<strong>两年后</strong>，迁都大兴城，是为京师。大兴城在汉长安城东南重新规划营建，也奠定了后来唐长安城的基本格局。</p><p>讲解时应区分 583 年迁都大兴与 605 年营建东都洛阳，不能把两次都城建设合成一件事。</p>`}
    ],
    y589:[
      scene("从分裂，<br/>走向一统。","589 年，隋灭陈。统一之后，大规模制度与工程才有可能。",[
        ["背景","长期分裂","南北对峙"],["转折","渡江灭陈","589 年"],["意义","交流发展","促进南北经济文化"]
      ],"589 · 灭陈统一"),
      mapCard("y589"),
      {tag:"book",tagText:"教材 · 重点",title:"统一全国的历史意义",yearLine:"589 年",body:`<p>隋的统一，结束了<strong>长期分裂</strong>局面，顺应了<strong>民族交融</strong>的大趋势，进一步促进了<strong>南北方经济、文化的交流和发展</strong>。</p><p>后面的大运河、科举、律令，全部建立在「全国是一个政治—经济共同体」这个前提上。</p>`}
    ],
    y604:[
      scene("开皇之治：<br/>把国家装进制度里。","604 年文帝去世前，隋已国力强盛。回看 581—604：制度是看不见的运河。",[

    const svg=root.querySelector("#mapSvg");

        }
        // initial chen color before unify
        if(yearId==="y577"||yearId==="y581"||yearId==="y583"){
          south.classList.add("chen");
        }
      });
    }
    if(btnZoom){
      btnZoom.disabled=true;
      btnZoom.addEventListener("click",()=>{
        if(!repaired) return;
        zoomed=!zoomed;
        const z=ZOOM[step.focus]||ZOOM.all;
        if(zoomed){
          svg.classList.add("zoomed");
          svg.style.transformOrigin=z.x+"px "+z.y+"px";
          btnZoom.textContent="还原全景";
          if(status) status.textContent="局部放大 · 再点还原";
        }else{
          svg.classList.remove("zoomed");
          btnZoom.textContent=step.zoomLabel||"放大局部";
          if(status) status.textContent="已修复全景 · 可放大局部";
        }
      });
    }
  }

  function mapMarkup(step){
    return `
<article class="map-stage">
  <div class="map-panel">
    <header>
      <div>
        <p class="tag map" style="margin-bottom:8px">地图 · 先修复再放大</p>
        <h2>${step.title}</h2>
      </div>
      <span class="map-status" data-map-status></span>
    </header>
    <div class="map-canvas">
      <div class="map-view">${mapSvgMarkup()}</div>
      <div class="map-legend">${(step.legend||[]).map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join("")}</div>
    </div>
    <div class="map-controls">
      <button type="button" class="btn-pill primary" data-map-repair>${step.actionLabel||"修复染色"}</button>
      <button type="button" class="btn-pill" data-map-zoom disabled>${step.zoomLabel||"放大局部"}</button>
    </div>
  </div>
  <aside class="map-side">
    <h3>${step.sideH}</h3>
    <p>${step.sideP}</p>
    ${(step.steps||[]).map((s,i)=>`<div class="step"><b>${i+1}</b><span>${s}</span></div>`).join("")}
    <p class="note" style="margin-top:16px;color:var(--sub);font-size:12px">示意图，非比例。572/612 实拍地图可作对照。</p>
  </aside>
</article>`;
  }

  /* ========== state ========== */
  let yi=0, ci=0, filtered=[];
  const el={
    railTrack:document.getElementById("railTrack"),
    railFill:document.getElementById("railFill"),
    yearUp:document.getElementById("yearUp"),
    yearDown:document.getElementById("yearDown"),
    slides:document.getElementById("slides"),
    cardPrev:document.getElementById("cardPrev"),
    cardNext:document.getElementById("cardNext"),
    dots:document.getElementById("dots"),
    kicker:document.getElementById("stageKicker"),
    count:document.getElementById("stageCount"),
    hint:document.getElementById("periodHint"),
    intro:document.getElementById("intro"),
    startBtn:document.getElementById("startBtn")
  };

  function buildRail(){
    YEARS.forEach((y,i)=>{
      const n=document.createElement("button");
      n.type="button";n.className="year-node";n.dataset.i=String(i);
      n.setAttribute("aria-label",y.label+" · "+y.caption);
      n.innerHTML='<span class="year-dot"></span><span class="year-label">'+y.label+'</span>';
      n.title=y.label+" · "+y.caption;
      n.addEventListener("click",()=>goYear(i,true));
      el.railTrack.appendChild(n);
    });
  }
  function railNodes(){return Array.from(el.railTrack.querySelectorAll(".year-node"));}
  function updateRail(){
    railNodes().forEach((n,i)=>{
      n.classList.toggle("active",i===yi);
      n.classList.toggle("done",i<yi);
      n.setAttribute("aria-current",i===yi?"step":"false");
    });
    const nodes=railNodes();
    if(nodes.length){
      const first=nodes[0],active=nodes[yi];
      const h=active.offsetTop+active.offsetHeight*.5-(first.offsetTop+6);
      el.railFill.style.height=Math.max(0,h)+"px";
    }
    el.yearUp.disabled=yi<=0;
    el.yearDown.disabled=yi>=YEARS.length-1;
  }
  function pagesOfYear(i){return PAGES[YEARS[i].id]||[];}

  function renderSlides(){
    const list=pagesOfYear(yi);filtered=list;
    el.slides.innerHTML="";
    list.forEach((c,i)=>{
      const s=document.createElement("section");
      s.className="slide";s.dataset.i=String(i);
      if(c.scene){
        s.classList.add("scene-slide");
        s.innerHTML='<article class="chapter-scene"><p class="scene-eyebrow">'+c.eyebrow+'</p><h2>'+c.title+'</h2><p class="scene-lead">'+c.lead+'</p><div class="scene-points">'+c.points.map((p,k)=>'<div class="scene-point" style="--order:'+k+'"><span>'+p[0]+'</span><h3>'+p[1]+'</h3><p>'+p[2]+'</p></div>').join("")+'</div><p class="scene-prompt">'+c.prompt+'</p></article>';
      } else if(c.map){
        const step=MAP_STEPS[c.yearId];
        s.innerHTML=mapMarkup(step);
        bindMap(s,c.yearId);
      } else {
        const tagCls=c.tag||"book";
        const cardCls="big-card"+(c.img?(c.wide?" wide-img":""):" no-img");
        s.innerHTML='<article class="'+cardCls+'">'+
          (c.img?'<div class="visual" style="background-image:url(\''+c.img+'\')"></div>':'<div class="visual"></div>')+
          '<div class="content"><span class="tag '+tagCls+'">'+(c.tagText||"教材")+'</span>'+
          '<span class="year-chip">'+(c.yearLine||YEARS[yi].caption)+'</span>'+
          '<h2>'+c.title+'</h2><div class="body">'+c.body+'</div></div></article>';
      }
      el.slides.appendChild(s);
    });
    el.dots.innerHTML="";
    list.forEach((_,i)=>{
      const b=document.createElement("button");b.type="button";
      b.setAttribute("aria-label","第 "+(i+1)+" 页");
      b.addEventListener("click",()=>goCard(i));
      el.dots.appendChild(b);
    });
    ci=0;applyTransform();
  }
  function applyTransform(){
    el.slides.style.transform="translateX(-"+ci*100+"%)";
    const list=filtered.length?filtered:pagesOfYear(yi);
    const y=YEARS[yi];
    el.kicker.textContent=y.label+" · "+y.caption;
    el.count.textContent=(ci+1)+" / "+list.length;
    const cur=list[ci]||{};
    el.hint.textContent=cur.map?"地图 · 先修复再放大":cur.scene?"阶段概述":(cur.tagText||"知识页");
    el.cardPrev.disabled=ci<=0&&yi===0;
    el.cardNext.disabled=ci>=list.length-1&&yi===YEARS.length-1;
    Array.from(el.slides.children).forEach((sl,i)=>{
      sl.classList.toggle("is-active",i===ci);
      sl.inert=i!==ci;
      sl.setAttribute("aria-hidden",String(i!==ci));
    });
    Array.from(el.dots.children).forEach((d,i)=>d.classList.toggle("on",i===ci));
    updateRail();
  }
  function goCard(i){
    const list=pagesOfYear(yi);
    ci=Math.max(0,Math.min(list.length-1,i));applyTransform();
  }
  function goYear(i,reset){
    yi=Math.max(0,Math.min(YEARS.length-1,i));
    if(reset!==false)ci=0;
    renderSlides();applyTransform();
    const node=railNodes()[yi];
    if(node)node.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
  function nextCard(){
    const list=pagesOfYear(yi);
    if(ci<list.length-1)goCard(ci+1);
    else if(yi<YEARS.length-1)goYear(yi+1);
  }
  function prevCard(){
    if(ci>0)goCard(ci-1);
    else if(yi>0){goYear(yi-1);const list=pagesOfYear(yi);goCard(list.length-1);}
  }

  el.cardNext.addEventListener("click",nextCard);
  el.cardPrev.addEventListener("click",prevCard);
  el.yearDown.addEventListener("click",()=>{if(yi<YEARS.length-1)goYear(yi+1);});
  el.yearUp.addEventListener("click",()=>{if(yi>0)goYear(yi-1);});

  const deck=document.querySelector(".deck");
  let tx=0,ty=0;
  deck.addEventListener("touchstart",e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;},{passive:true});
  deck.addEventListener("touchend",e=>{
    const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){if(dx<0)nextCard();else prevCard();}
  },{passive:true});

  document.addEventListener("keydown",e=>{
    if(el.intro&&!el.intro.classList.contains("hide")){
      if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}
      return;
    }
    if(e.target&&/input|textarea|select/i.test(e.target.tagName))return;
    if(e.key==="ArrowRight"){e.preventDefault();nextCard();}
    else if(e.key==="ArrowLeft"){e.preventDefault();prevCard();}
    else if(e.key==="ArrowDown"){e.preventDefault();if(yi<YEARS.length-1)goYear(yi+1);}
    else if(e.key==="ArrowUp"){e.preventDefault();if(yi>0)goYear(yi-1);}
    else if(e.key>="1"&&e.key<="9"){const i=parseInt(e.key,10)-1;if(i<YEARS.length){e.preventDefault();goYear(i);}}
    else if(e.key==="0"){e.preventDefault();goYear(YEARS.length-1);}
  });

  function start(){el.intro.classList.add("hide");goYear(0);}
  el.startBtn.addEventListener("click",start);

  buildRail();
  goYear(0);
})();
</script>
</body>
</html>
