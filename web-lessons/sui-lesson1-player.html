<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>隋朝统一与灭亡 · 课堂播放器</title>
<style>
:root {
  --ink: #1d1d1f;
  --muted: #6e6e73;
  --sub: #86868b;
  --blue: #0071e3;
  --blue-soft: #e8f1fc;
  --bg: #f5f5f7;
  --card: #ffffff;
  --line: rgba(0,0,0,.08);
  --rail-w: 112px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  overflow: hidden;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
img { max-width: 100%; display: block; }

.app {
  display: grid;
  grid-template-columns: var(--rail-w) 1fr;
  height: 100vh;
  width: 100vw;
}

/* ========== LEFT RAIL: time + progress ========== */
.rail {
  background: #fff;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0 10px;
  z-index: 5;
  user-select: none;
}
.rail-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  transition: background .15s, opacity .15s;
}
.rail-btn:hover { background: #e8e8ed; }
.rail-btn:disabled { opacity: .3; cursor: default; }
.rail-btn.next-year { background: var(--blue); color: #fff; }
.rail-btn.next-year:hover { background: #0077ED; }
.rail-btn.next-year:disabled { background: #a0c4ef; opacity: 1; }

.rail-track {
  flex: 1;
  width: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px 10px 8px;
  scroll-behavior: smooth;
  scrollbar-width: none;
  position: relative;
}
.rail-track::-webkit-scrollbar { display: none; }

/* spine line */
.rail-track::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 18px; bottom: 18px;
  width: 2px;
  background: #e5e5ea;
  transform: translateX(-50%);
  border-radius: 1px;
  z-index: 0;
}
.rail-fill {
  position: absolute;
  left: 50%;
  top: 18px;
  width: 2px;
  background: var(--blue);
  transform: translateX(-50%);
  border-radius: 1px;
  z-index: 1;
  height: 0;
  transition: height .35s ease;
}

.year-node {
  position: relative;
  z-index: 2;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 0 10px;
  cursor: pointer;
}
.year-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #fff;
  border: 2.5px solid #d2d2d7;
  transition: border-color .2s, transform .2s, background .2s;
  flex-shrink: 0;
}
.year-node.done .year-dot {
  border-color: var(--blue);
  background: var(--blue);
}
.year-node.active .year-dot {
  border-color: var(--blue);
  background: var(--blue);
  transform: scale(1.35);
  box-shadow: 0 0 0 4px rgba(0,113,227,.15);
}
.year-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--sub);
  letter-spacing: -.01em;
  line-height: 1.15;
  text-align: center;
  transition: color .2s;
}
.year-node.active .year-label { color: var(--blue); font-size: 12px; }
.year-node.done .year-label { color: var(--ink); }
/* mini progress bar per year */
.year-bar {
  width: 42px; height: 3px;
  background: #e5e5ea;
  border-radius: 2px;
  overflow: hidden;
}
.year-bar i {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--blue);
  border-radius: 2px;
  transition: width .3s ease;
}
.year-node.done .year-bar i { width: 100%; }
.year-node.active .year-bar i { background: var(--blue); }

.rail-brand {
  font-size: 10px;
  color: var(--sub);
  text-align: center;
  padding: 8px 6px 0;
  line-height: 1.3;
  letter-spacing: .02em;
}

/* ========== STAGE ========== */
.stage {
  position: relative;
  overflow: hidden;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.stage-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px 10px;
  flex-shrink: 0;
}
.stage-kicker {
  font-size: 14px;
  color: var(--blue);
  font-weight: 600;
}
.stage-count {
  font-size: 13px;
  color: var(--sub);
  font-variant-numeric: tabular-nums;
}

.deck {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
  min-height: 0;
}

/* large card slide */
.slides {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform .45s cubic-bezier(.32,.72,0,1);
  will-change: transform;
}
.slide {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  padding: 8px 56px 24px;
  display: flex;
  min-height: 0;
}
@media (max-width: 900px) {
  .slide { padding: 8px 48px 16px; }
}

.big-card {
  background: var(--card);
  border-radius: 28px;
  box-shadow: 0 2px 6px rgba(0,0,0,.04), 0 18px 48px rgba(0,0,0,.08);
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  overflow: hidden;
  min-height: 0;
}
.big-card.no-img {
  grid-template-columns: 1fr;
}
.big-card.has-img-wide {
  grid-template-columns: 1.2fr 0.8fr;
}
@media (max-width: 900px) {
  .big-card, .big-card.has-img-wide {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
  }
  .big-card .visual { min-height: 180px; max-height: 32vh; }
}

.big-card .content {
  padding: 36px 40px 32px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
}
.big-card .content::-webkit-scrollbar { width: 4px; }
.big-card .content::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 2px; }

.tag {
  display: inline-flex;
  align-self: flex-start;
  font-size: 13px;
  font-weight: 500;
  padding: 5px 12px;
  border-radius: 980px;
  margin-bottom: 14px;
  background: var(--bg);
  color: var(--muted);
}
.tag.book { background: var(--blue); color: #fff; }
.tag.extend { background: #424245; color: #f5f5f7; }
.tag.cost { background: #9a4b1f; color: #fff; }

.big-card h2 {
  font-size: clamp(28px, 3.2vw, 40px);
  font-weight: 600;
  letter-spacing: -.025em;
  line-height: 1.15;
  margin: 0 0 8px;
}
.year-chip {
  display: inline-block;
  font-size: 14px;
  font-weight: 600;
  color: var(--blue);
  margin-bottom: 14px;
}
.big-card .body {
  font-size: clamp(20px, 1.55vw, 26px);
  line-height: 1.75;
  color: var(--ink);
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
}
.big-card .body p { margin: 0 0 0.85em; }
.big-card .body p:last-child { margin-bottom: 0; }
.big-card .body strong { font-weight: 600; }
.big-card .note {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 14px;
  color: var(--sub);
  line-height: 1.5;
}

.visual {
  background: #1d1d1f center/cover no-repeat;
  min-height: 0;
  position: relative;
}
.visual::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(0,0,0,.08), transparent 30%);
  pointer-events: none;
}
.big-card.no-img .visual { display: none; }

/* dark card variant */
.big-card.dark {
  background: #1d1d1f;
  color: #f5f5f7;
}
.big-card.dark .body { color: #f5f5f7; }
.big-card.dark .note { color: #86868b; border-top-color: rgba(255,255,255,.12); }
.big-card.dark .tag.extend { background: rgba(255,255,255,.14); }
.big-card.dark .tag { background: rgba(255,255,255,.1); color: #a1a1a6; }

/* side arrows */
.nav-side {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,.92);
  box-shadow: 0 2px 12px rgba(0,0,0,.12);
  font-size: 22px;
  color: var(--ink);
  z-index: 4;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
  transition: opacity .2s, transform .2s;
}
.nav-side:hover { transform: translateY(-50%) scale(1.06); }
.nav-side:disabled { opacity: .3; cursor: default; transform: translateY(-50%); }
.nav-side.prev { left: 8px; }
.nav-side.next { right: 8px; }

/* bottom bar */
.stage-bottom {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 28px 18px;
  gap: 16px;
}
.dots {
  display: flex;
  gap: 6px;
  flex: 1;
  justify-content: center;
  flex-wrap: wrap;
}
.dots button {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #d2d2d7;
  padding: 0;
  transition: width .2s, background .2s, border-radius .2s;
}
.dots button.on {
  width: 22px;
  border-radius: 4px;
  background: var(--ink);
}
.hint {
  font-size: 12px;
  color: var(--sub);
  white-space: nowrap;
}

/* intro overlay */
.intro {
  position: absolute; inset: 0;
  z-index: 20;
  background:
    linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,.55)),
    url("assets/hero-sui-capital.png") center/cover no-repeat;
  color: #f5f5f7;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px;
  transition: opacity .5s, visibility .5s;
}
.intro.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.intro h1 {
  font-size: clamp(40px, 6vw, 72px);
  font-weight: 600;
  letter-spacing: -.03em;
  margin: 0 0 12px;
}
.intro .sub {
  font-size: clamp(18px, 2vw, 24px);
  color: #a1a1a6;
  margin: 0 0 8px;
}
.intro .meta {
  font-size: 14px;
  color: #86868b;
  margin: 0 0 36px;
}
.intro .btn {
  display: inline-flex;
  padding: 14px 32px;
  border-radius: 980px;
  background: var(--blue);
  color: #fff;
  font-size: 18px;
  font-weight: 500;
  box-shadow: 0 4px 20px rgba(0,113,227,.35);
  transition: transform .15s;
}
.intro .btn:hover { transform: scale(1.04); }
.intro .how {
  margin-top: 28px;
  font-size: 13px;
  color: #86868b;
  line-height: 1.6;
}

/* mobile rail collapse */
@media (max-width: 640px) {
  :root { --rail-w: 72px; }
  .year-label { font-size: 10px; }
  .year-bar { width: 28px; }
  .slide { padding: 4px 40px 10px; }
  .big-card .content { padding: 22px 20px; }
}
</style>

<script>
(function () {
  const YEARS = [
    { id: "yIntro", label: "导入", caption: "37年何以影响千年" },
    { id: "y577", label: "577", caption: "北周灭北齐" },
    { id: "y581", label: "581", caption: "隋文帝建隋" },
    { id: "y583", label: "583", caption: "迁都大兴" },
    { id: "y589", label: "589", caption: "灭陈统一" },
    { id: "y604", label: "604", caption: "开皇之治" },
    { id: "y605", label: "605", caption: "炀帝继位" },
    { id: "y607", label: "607", caption: "设进士科" },
    { id: "y610", label: "610", caption: "运河贯通" },
    { id: "y614", label: "614", caption: "三征高句丽" },
    { id: "y615", label: "615", caption: "雁门之围" },
    { id: "y618", label: "618", caption: "炀帝落幕" },
    { id: "ySum", label: "总结", caption: "奇观误国" },
    { id: "yEnd", label: "结束", caption: "课后讨论" }
  ];

  /** cards: strictly aligned to 知识点内容库 chapter order */
  const CARDS = [
    {
      year: "yIntro", tag: "book", tagText: "导入",
      title: "37 年的王朝，何以影响千年？", yearLine: "581—618 年",
      img: "assets/hero-sui-capital.png", wide: true,
      body: `<p>板书两个数字：<strong>37</strong> 与 <strong>1300</strong>。隋仅存续三十七年、历二代君主；其确立的科举选官之制，沿至清末约一千三百年。国祚短促，不等于历史地位轻微。</p>
      <p><strong>反差立骨：</strong>大运河全长二千七百多千米，是当时世界上最长的运河；589 年的统一，结束了自西晋末年以来延续二百七十余年的南北分裂；三省六部与律令体系深刻影响此后千余年。</p>
      <blockquote>尽道隋亡为此河，至今千里赖通波。若无水殿龙舟事，共禹论功不较多。<cite>皮日休《汴河怀古》· 教材卷首引诗</cite></blockquote>
      <p><strong>国祚口径：</strong>自 581 年代周建隋至 618 年隋亡，凡三十七年；若自 589 年灭陈统一计起，则为二十九年。教材笼统称「三十多年」，是就王朝国祚而言。</p>
      <p>本课围绕主问题展开：<strong>何以兴？何以亡？</strong></p>`
    },
    {
      year: "y577",
      tag: "map", tagText: "地图演示",
      title: "577 · 北周吞并北齐",
      yearLine: "577 年",
      evidence: "unifyMap",
      unifyStep: "577"
    },
    {
      year: "y577",
      tag: "extend", tagText: "拓展",
      title: "北方一体意味着什么",
      yearLine: "统一前夜",
      img: "assets/north-unification-577.png", wide: true,
      body: `<p><strong>战争过程：</strong>575 年北周武帝首次大举东征；576 年攻取晋阳；577 年进入邺城，北齐灭亡。北方长期东西对峙的军事格局由此结束。</p>
      <p><strong>资源变化：</strong>分裂已久的北方人口、仓廪、甲兵与工匠，第一次被同一个政权集中调度——这正是四年之后隋得以代周、又十二年之后得以渡江平陈的物质前提。</p>
      <p><strong>空间张力：</strong>「关中军政本位」与「关东财赋所出」之间的矛盾，预示了日后营建洛阳、开凿运河的历史必要。隋的统一，其前半段在 577 年已经写就。</p>`
    },
    {
      year: "y577",
      tag: "extend", tagText: "拓展",
      title: "关陇集团与禅代逻辑",
      yearLine: "制度背景",
      img: "assets/illus-guanlong.png",
      wide: true,
      dark: true,
      body: `<p>西魏、北周、隋以至唐初，统治核心是以关中为根据地、胡汉融合的军事与官僚联盟，即「<strong>关陇集团</strong>」。北周以府兵制把将领、乡兵与土地捆绑在一起。</p>
      <p>杨坚代周，就其性质而言是<strong>同一集团内部的权力再分配</strong>，而非自下而上的草莽革命。隋初得以迅速沿用前朝官僚与制度；同时门第与军功贵族的既得利益被整体带入新王朝，构成日后以科举「破格取士」时必须面对的反作用力。</p>
      <p>关陇一脉相承，解释了「隋唐同源」，也解释了炀帝后期杨玄感等勋贵何以相继反叛。</p>`
    },
    {
      year: "y581",
      tag: "map", tagText: "地图演示",
      title: "581 · 隋文帝建立隋朝",
      yearLine: "581 年",
      evidence: "unifyMap",
      unifyStep: "581"
    },
    {
      year: "y581",
      tag: "book", tagText: "教材",
      title: "杨坚代周建隋",
      yearLine: "581 年",
      img: "assets/portrait-wendi.jpg",
      real: true,
      contain: true,
      caption: "隋文帝杨坚像（传世画像）",
      body: `<p>北周末年，外戚<strong>杨坚</strong>执掌朝政。581 年，杨坚夺取北周政权，建立隋朝，<strong>仍以长安为都</strong>，是为隋文帝。</p>
      <p><strong>权力来源：</strong>杨坚的长女是北周宣帝皇后。580 年宣帝去世，年幼的静帝即位，杨坚以外戚身份辅政，并迅速掌握中央军政大权。</p>
      <p><strong>消除反对：</strong>相州总管尉迟迥、郧州总管司马消难、益州总管王谦「三方之乱」，主帅韦孝宽平定。地方军事反抗失败后，北周宗室和旧臣已难以阻止政权更替。</p>
      <p><strong>禅代建国：</strong>其父杨忠受封随国公；即位后以「随」字从走、寓奔走不宁之意，遂去走之旁，定国号为<strong>「隋」</strong>，改元开皇。</p>
      <p>这一年变换的是政权名号与色块，北方的疆域并未因此发生大的变动；迁入大兴城是在两年后的 583 年。</p>`
    },
    {
      year: "y581",
      tag: "extend", tagText: "拓展",
      title: "「开皇」年号与治国姿态",
      yearLine: "制度伏笔",

    });
    ci = 0;
    applyTransform();
    void el.slides.offsetWidth;
    el.slides.style.transition = "";
  }

  function applyTransform() {
    el.slides.style.transform = "translateX(-" + ci * 100 + "%)";
    const list = filtered.length ? filtered : cardsOfYear(yi);
    const y = YEARS[yi];
    el.kicker.textContent = y.label + " · " + y.caption;
    el.count.textContent = (ci + 1) + " / " + list.length;
    el.hint.textContent = list[ci].evidence === "unifyMap" ? "地图演示" : list[ci].evidence ? "史料与证据" : list[ci].scene ? "总结" : (list[ci].tagText || "课程内容");
    el.cardPrev.disabled = ci <= 0 && yi === 0;
    el.cardNext.disabled = ci >= list.length - 1 && yi === YEARS.length - 1;
    Array.from(el.slides.children).forEach((slide, i) => {
      slide.classList.toggle("is-active", i === ci);
      slide.inert = i !== ci;
      slide.setAttribute("aria-hidden", String(i !== ci));
    });
    Array.from(el.dots.children).forEach((d, i) => d.classList.toggle("on", i === ci));
    updateRail();
  }

  function goCard(i) {
    const list = cardsOfYear(yi);
    ci = Math.max(0, Math.min(list.length - 1, i));
    applyTransform();
  }

  function goYear(i, resetCard) {
    yi = Math.max(0, Math.min(YEARS.length - 1, i));
    if (resetCard !== false) ci = 0;
    renderSlides();
    applyTransform();
    // scroll rail node into view
    const node = railNodes()[yi];
    if (node) node.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function nextCard() {
    const list = cardsOfYear(yi);
    if (ci < list.length - 1) goCard(ci + 1);
    else if (yi < YEARS.length - 1) goYear(yi + 1);
  }
  function prevCard() {
    if (ci > 0) goCard(ci - 1);
    else if (yi > 0) {
      goYear(yi - 1);
      const list = cardsOfYear(yi);
      goCard(list.length - 1);
    }
  }
  function nextYear() { if (yi < YEARS.length - 1) goYear(yi + 1); }
  function prevYear() { if (yi > 0) goYear(yi - 1); }

  /* —— events —— */
  el.cardNext.addEventListener("click", nextCard);
  el.cardPrev.addEventListener("click", prevCard);
  el.yearDown.addEventListener("click", nextYear);
  el.yearUp.addEventListener("click", prevYear);

  // swipe on deck
  const deck = document.querySelector(".deck");
  let tx = 0, ty = 0;
  deck.addEventListener("touchstart", (e) => {
    tx = e.changedTouches[0].clientX;
    ty = e.changedTouches[0].clientY;
  }, { passive: true });
  deck.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) nextCard(); else prevCard();
    }
  }, { passive: true });

  document.addEventListener("keydown", (e) => {
    if (document.getElementById("photoViewer")?.open) return;
    if (el.intro && !el.intro.classList.contains("hide")) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); start(); }
      return;
    }
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === "ArrowRight") { e.preventDefault(); nextCard(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prevCard(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); nextYear(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); prevYear(); }
    else if (e.key >= "1" && e.key <= "9") {
      const i = parseInt(e.key, 10) - 1;
      if (i < YEARS.length) { e.preventDefault(); goYear(i); }
    } else if (e.key === "0") {
      e.preventDefault(); goYear(YEARS.length - 1); // 618 末年
    }
  });

  function start() {
    el.intro.classList.add("hide");
    el.intro.inert = true;
    document.querySelector(".rail").inert = false;
    document.querySelectorAll(".stage-top,.deck,.stage-bottom").forEach(n => n.inert = false);
    document.getElementById("homeBtn").focus();
    goYear(0);
  }
  el.startBtn.addEventListener("click", start);

  document.getElementById("homeBtn").addEventListener("click", () => {
    el.intro.inert = false;
    el.intro.classList.remove("hide");
    document.querySelector(".rail").inert = true;
    document.querySelectorAll(".stage-top,.deck,.stage-bottom").forEach(n => n.inert = true);
    el.startBtn.focus();
  });
  const fullButton = document.getElementById("fullscreenBtn");
  if (!document.fullscreenEnabled) fullButton.hidden = true;
  fullButton.addEventListener("click", async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (_) { fullButton.textContent = "请使用浏览器全屏"; }
  });
  document.addEventListener("fullscreenchange", () => {
    fullButton.textContent = document.fullscreenElement ? "退出全屏 ↙" : "全屏 ↗";
  });
  document.querySelector(".rail").inert = true;
  document.querySelectorAll(".stage-top,.deck,.stage-bottom").forEach(n => n.inert = true);
  /* —— init —— */
  buildRail();
  goYear(0);
})();
</script>
</body>
</html>
