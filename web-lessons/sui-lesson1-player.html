<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>隋朝统一与灭亡 · 课堂播放器</title>
<style>
:root {
  --ink: #1d1d1f;
  --muted: #6e6e73;
  --sub: #86868b;
  --blue: #0071e3;
  --blue-soft: #e8f1fc;
  --bg: #f5f5f7;
  --card: #ffffff;
  --line: rgba(0,0,0,.08);
  --rail-w: 112px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  overflow: hidden;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
img { max-width: 100%; display: block; }

.app {
  display: grid;
  grid-template-columns: var(--rail-w) 1fr;
  height: 100vh;
  width: 100vw;
}

/* ========== LEFT RAIL: time + progress ========== */
.rail {
  background: #fff;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0 10px;
  z-index: 5;
  user-select: none;
}
.rail-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  transition: background .15s, opacity .15s;
}
.rail-btn:hover { background: #e8e8ed; }
.rail-btn:disabled { opacity: .3; cursor: default; }
.rail-btn.next-year { background: var(--blue); color: #fff; }
.rail-btn.next-year:hover { background: #0077ED; }
.rail-btn.next-year:disabled { background: #a0c4ef; opacity: 1; }

.rail-track {
  flex: 1;
  width: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px 10px 8px;
  scroll-behavior: smooth;
  scrollbar-width: none;
  position: relative;
}
.rail-track::-webkit-scrollbar { display: none; }

/* spine line */
.rail-track::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 18px; bottom: 18px;
  width: 2px;
  background: #e5e5ea;
  transform: translateX(-50%);
  border-radius: 1px;
  z-index: 0;
}
.rail-fill {
  position: absolute;
  left: 50%;
  top: 18px;
  width: 2px;
  background: var(--blue);
  transform: translateX(-50%);
  border-radius: 1px;
  z-index: 1;
  height: 0;
  transition: height .35s ease;
}

.year-node {
  position: relative;
  z-index: 2;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 0 10px;
  cursor: pointer;
}
.year-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #fff;
  border: 2.5px solid #d2d2d7;
  transition: border-color .2s, transform .2s, background .2s;
  flex-shrink: 0;
}
.year-node.done .year-dot {
  border-color: var(--blue);
  background: var(--blue);
}
.year-node.active .year-dot {
  border-color: var(--blue);
  background: var(--blue);
  transform: scale(1.35);
  box-shadow: 0 0 0 4px rgba(0,113,227,.15);
}
.year-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--sub);
  letter-spacing: -.01em;
  line-height: 1.15;
  text-align: center;
  transition: color .2s;
}
.year-node.active .year-label { color: var(--blue); font-size: 12px; }
.year-node.done .year-label { color: var(--ink); }
/* mini progress bar per year */
.year-bar {
  width: 42px; height: 3px;
  background: #e5e5ea;
  border-radius: 2px;
  overflow: hidden;
}
.year-bar i {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--blue);
  border-radius: 2px;
  transition: width .3s ease;
}
.year-node.done .year-bar i { width: 100%; }
.year-node.active .year-bar i { background: var(--blue); }

.rail-brand {
  font-size: 10px;
  color: var(--sub);
  text-align: center;
  padding: 8px 6px 0;
  line-height: 1.3;
  letter-spacing: .02em;
}

/* ========== STAGE ========== */
.stage {
  position: relative;
  overflow: hidden;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.stage-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px 10px;
  flex-shrink: 0;
}
.stage-kicker {
  font-size: 14px;
  color: var(--blue);
  font-weight: 600;
}
.stage-count {
  font-size: 13px;
  color: var(--sub);
  font-variant-numeric: tabular-nums;
}

.deck {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
  min-height: 0;
}

/* large card slide */
.slides {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform .45s cubic-bezier(.32,.72,0,1);
  will-change: transform;
}
.slide {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  padding: 8px 56px 24px;
  display: flex;
  min-height: 0;
}
@media (max-width: 900px) {
  .slide { padding: 8px 48px 16px; }
}

.big-card {
  background: var(--card);
  border-radius: 28px;
  box-shadow: 0 2px 6px rgba(0,0,0,.04), 0 18px 48px rgba(0,0,0,.08);
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  overflow: hidden;
  min-height: 0;
}
.big-card.no-img {
  grid-template-columns: 1fr;
}
.big-card.has-img-wide {
  grid-template-columns: 1.2fr 0.8fr;
}
@media (max-width: 900px) {
  .big-card, .big-card.has-img-wide {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
  }
  .big-card .visual { min-height: 180px; max-height: 32vh; }
}

.big-card .content {
  padding: 36px 40px 32px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.big-card .content::-webkit-scrollbar { width: 4px; }
.big-card .content::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 2px; }

.tag {
  display: inline-flex;
  align-self: flex-start;
  font-size: 13px;
  font-weight: 500;
  padding: 5px 12px;
  border-radius: 980px;
  margin-bottom: 14px;
  background: var(--bg);
  color: var(--muted);
}
.tag.book { background: var(--blue); color: #fff; }
.tag.extend { background: #424245; color: #f5f5f7; }
.tag.cost { background: #9a4b1f; color: #fff; }

.big-card h2 {
  font-size: clamp(28px, 3.2vw, 40px);
  font-weight: 600;
  letter-spacing: -.025em;
  line-height: 1.15;
  margin: 0 0 8px;
}
.year-chip {
  display: inline-block;
  font-size: 14px;
  font-weight: 600;
  color: var(--blue);
  margin-bottom: 14px;
}
.big-card .body {
  font-size: clamp(16px, 1.35vw, 19px);
  line-height: 1.7;
  color: var(--ink);
  flex: 1;
}
.big-card .body p { margin: 0 0 0.85em; }
.big-card .body p:last-child { margin-bottom: 0; }
.big-card .body strong { font-weight: 600; }
.big-card .note {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 14px;
  color: var(--sub);
  line-height: 1.5;
}

.visual {
  background: #1d1d1f center/cover no-repeat;
  min-height: 0;
  position: relative;
}
.visual::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(0,0,0,.08), transparent 30%);
  pointer-events: none;
}
.big-card.no-img .visual { display: none; }

/* dark card variant */
.big-card.dark {
  background: #1d1d1f;
  color: #f5f5f7;
}
.big-card.dark .body { color: #f5f5f7; }
.big-card.dark .note { color: #86868b; border-top-color: rgba(255,255,255,.12); }
.big-card.dark .tag.extend { background: rgba(255,255,255,.14); }
.big-card.dark .tag { background: rgba(255,255,255,.1); color: #a1a1a6; }

/* side arrows */
.nav-side {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,.92);
  box-shadow: 0 2px 12px rgba(0,0,0,.12);
  font-size: 22px;
  color: var(--ink);
  z-index: 4;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
  transition: opacity .2s, transform .2s;
}
.nav-side:hover { transform: translateY(-50%) scale(1.06); }
.nav-side:disabled { opacity: .3; cursor: default; transform: translateY(-50%); }
.nav-side.prev { left: 8px; }
.nav-side.next { right: 8px; }

/* bottom bar */
.stage-bottom {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 28px 18px;
  gap: 16px;
}
.dots {
  display: flex;
  gap: 6px;
  flex: 1;
  justify-content: center;
  flex-wrap: wrap;
}
.dots button {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #d2d2d7;
  padding: 0;
  transition: width .2s, background .2s, border-radius .2s;
}
.dots button.on {
  width: 22px;
  border-radius: 4px;
  background: var(--ink);
}
.hint {
  font-size: 12px;
  color: var(--sub);
  white-space: nowrap;
}

/* intro overlay */
.intro {
  position: absolute; inset: 0;
  z-index: 20;
  background:
    linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,.55)),
    url("assets/hero-sui-capital.png") center/cover no-repeat;
  color: #f5f5f7;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px;
  transition: opacity .5s, visibility .5s;
}
.intro.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.intro h1 {
  font-size: clamp(40px, 6vw, 72px);
  font-weight: 600;
  letter-spacing: -.03em;
  margin: 0 0 12px;
}
.intro .sub {
  font-size: clamp(18px, 2vw, 24px);
  color: #a1a1a6;
  margin: 0 0 8px;
}
.intro .meta {
  font-size: 14px;
  color: #86868b;
  margin: 0 0 36px;
}
.intro .btn {
  display: inline-flex;
  padding: 14px 32px;
  border-radius: 980px;
  background: var(--blue);
  color: #fff;
  font-size: 18px;
  font-weight: 500;
  box-shadow: 0 4px 20px rgba(0,113,227,.35);
  transition: transform .15s;
}
.intro .btn:hover { transform: scale(1.04); }
.intro .how {
  margin-top: 28px;
  font-size: 13px;
  color: #86868b;
  line-height: 1.6;
}

/* mobile rail collapse */
@media (max-width: 640px) {
  :root { --rail-w: 72px; }
  .year-label { font-size: 10px; }
  .year-bar { width: 28px; }
  .slide { padding: 4px 40px 10px; }
  .big-card .content { padding: 22px 20px; }
}
</style>

<script>
(function () {
  const YEARS = [
    { id: "y577", label: "577", caption: "北周灭北齐" },
    { id: "y581", label: "581", caption: "隋文帝建隋" },
    { id: "y583", label: "583", caption: "迁都大兴" },
    { id: "y589", label: "589", caption: "灭陈统一" },
    { id: "y604", label: "604", caption: "开皇之治" },
    { id: "y605", label: "605", caption: "炀帝继位" },
    { id: "y607", label: "607", caption: "设进士科" },
    { id: "y610", label: "610", caption: "运河贯通" },
    { id: "y614", label: "612–14", caption: "三征高句丽" },
    { id: "y615", label: "615", caption: "雁门之围" },
    { id: "y618", label: "618", caption: "炀帝落幕" },
    { id: "ySum", label: "总结", caption: "暴政速亡" },
    { id: "yEnd", label: "讨论", caption: "课后活动" }
  ];

  /** cards: each is nearly a full teaching page */
  const CARDS = [
    {
      year: "y577",
      tag: "map", tagText: "地图 · 先修复再放大",
      title: "577 · 北周吞并北齐",
      yearLine: "577 年",
      evidence: "unifyMap",
      unifyStep: "577"
    },
    {
      year: "y577",
      tag: "extend", tagText: "拓展",
      title: "北方一体意味着什么",
      yearLine: "统一前夜",
      body: `<p>北周灭北齐后，北方军事与财政资源集中。杨坚所在的关陇集团，掌握府兵与官僚网络。</p>
      <p>581 建隋，不是从零起家，而是<strong>接盘已经一体化的北方</strong>，再向南推进。</p>`
    },
    {
      year: "y581",
      tag: "map", tagText: "地图 · 先修复再放大",
      title: "581 · 隋文帝建立隋朝",
      yearLine: "581 年",
      evidence: "unifyMap",
      unifyStep: "581"
    },
    {
      year: "y583",
      tag: "map", tagText: "地图 · 标点",
      title: "583 · 迁都大兴城",
      yearLine: "583 年",
      evidence: "unifyMap",
      unifyStep: "583"
    },
    {
      year: "y589",
      tag: "map", tagText: "地图 · 先修复再放大",
      title: "589 · 过长江统一陈朝",
      yearLine: "589 年",
      evidence: "unifyMap",
      unifyStep: "589"
    },
    {
      year: "y605",
      tag: "extend", tagText: "拓展",
      title: "宫廷斗争与统治心理",
      yearLine: "604–605",
      body: `<p>教材写「急功近利，不惜民力」。拓展理解：炀帝在夺嫡与即位过程中依赖权术与军事威慑，即位后更倾向<strong>以宏大工程证明合法性</strong>。</p>
      <p>课堂提示：落点应是<strong>决策模式</strong>（高动员、短反馈、拒绝收缩），而不是给人物贴标签。</p>`
    },
    {
      year: "y607",
      tag: "book", tagText: "教材",
      title: "考试内容（可拓展讲）",
      yearLine: "进士科",
      body: `<p>隋唐进士科重<strong>诗赋与时务策</strong>，兼及经义。程序由简到繁：举送 → 考试 → 授官。</p>
      <p>抓住一点即可：<strong>把「会不会考试」变成入仕的重要门槛</strong>，门第垄断被打开缺口。</p>`
    },
    {
      year: "ySum",
      tag: "book", tagText: "课堂收束",
      title: "何以暴政速亡，奇观误国",
      yearLine: "总结",
      body: `<p><strong>暴政速亡</strong>：不是没有能力，而是拒绝收缩——高动员、短反馈、民力透支。<br/>
      <strong>奇观误国</strong>：不是运河本身有罪，而是把通道变成无止境的展示与征发。</p>
      <p>遗产仍在：统一、科举、运河、律令，被唐继承。</p>`
    },
    {
      year: "yEnd",
      tag: "book", tagText: "讨论",
      title: "课后活动",
      yearLine: "结束",
      body: `<p>① 科举对当时社会的影响？② 隋速亡原因？③ 如何评价大运河功过？④【拓展】文帝与炀帝，同一套国家能力为何相反果实？</p>`
    },
    {
      year: "y581",
      tag: "book", tagText: "教材",
      title: "杨坚代周建隋",
      yearLine: "581 年",
      body: `<p>北周末年，外戚<strong>杨坚</strong>执掌朝政。581 年，杨坚夺取北周政权，建立隋朝，<strong>仍以长安为都</strong>，是为隋文帝。</p>
      <p>「仍」字很关键：他没有立刻迁都，而是先稳住关中根本。理解「执掌朝政」四字，才能理解后面的禅代如何实现——这次政权更替有此前掌握朝政与平定反对势力的背景。</p>
      <p>国号「隋」。隋由此开启了一个与秦、汉并称「再造统一」的王朝，尽管它只存在了三十多年。</p>`
    },
    {
      year: "y581",
      tag: "extend", tagText: "拓展",
      title: "关陇集团与禅代逻辑",
      yearLine: "制度背景",
      dark: true,
      body: `<p>北周本身就出自关陇军事贵族集团，府兵制把胡汉将领与土地、部民绑在一起。杨坚是这一集团里最有权势的外戚。</p>
      <p>代周不是「农民起义推翻旧朝」，而是<strong>同一统治集团内部的权力重组</strong>。这决定了隋初治理的特点：大量保留前朝官僚与制度资源，行政能迅速上手；同时也把关陇贵族的既得利益带进了新王朝。</p>
      <p>后来的科举、律令改革，都要与这股力量周旋——这也是理解「为什么要从门第转向才识」的钥匙。</p>`
    },
    {
      year: "y583",
      tag: "book", tagText: "教材",
      title: "营建并迁都大兴城",
      yearLine: "582 营建 → 583 迁都",

  function cardIndexInYear() {
    const list = cardsOfYear(yi);
    // ci is index within current year
    return Math.min(ci, Math.max(0, list.length - 1));
  }

  function renderSlides() {
    const list = cardsOfYear(yi);
    filtered = list;
    el.slides.style.transition = "none";
    el.slides.innerHTML = "";
    list.forEach((c, i) => {
      const s = document.createElement("section");
      s.className = "slide";
      s.dataset.i = String(i);
      s.style.setProperty("--chapter-year", '"' + YEARS[yi].label + '"');
      const tagCls = c.tag || "book";
      const cardCls = "big-card" + (c.img ? (c.wide ? " has-img-wide" : "") : " no-img") + (c.dark ? " dark" : "");
      s.innerHTML =
        '<article class="' + cardCls + '">' +
          (c.img
            ? '<div class="visual" style="background-image:url(\'' + c.img + '\')"></div>'
            : '<div class="visual"></div>') +
          '<div class="content">' +
            '<span class="tag ' + tagCls + '">' + (c.tagText || "教材") + "</span>" +
            '<span class="year-chip">' + (c.yearLine || YEARS[yi].caption) + "</span>" +
            "<h2>" + c.title + "</h2>" +
            '<div class="body">' + c.body + "</div>" +
          "</div>" +
        "</article>";
      const narrativeTitles = ["杨坚代周建隋", "营建并迁都大兴城", "渡江灭陈，全国一统", "开皇之治：国力迅速恢复", "开通大运河", "开创科举取士制度", "经略流求（台湾）", "三次征辽东", "618 年隋亡"];
      if (narrativeTitles.includes(c.title)) {
        s.classList.add("narrative-slide");
        s.querySelector("article").classList.add("narrative-page");
      }
      if (c.scene) {
        s.classList.add("scene-slide");
        s.innerHTML = sceneMarkup(c);
      }
      if (c.evidence) {
        s.classList.add("evidence-slide");
        if (c.evidence === "unifyMap") {
          s.innerHTML = window.SUI_EVIDENCE.unifyMap(c.unifyStep || "577");
        } else {
          s.innerHTML = window.SUI_EVIDENCE.render(c.evidence);
        }
      }
      if (c.img) {
        const visual = s.querySelector(".visual");
        visual.setAttribute("role", c.real ? "group" : "img");
        visual.setAttribute("aria-label", c.caption || c.title + " · AI教学示意");
        visual.classList.toggle("real-photo", !!c.real);
        visual.classList.toggle("contain-photo", !!c.contain);
        const caption = document.createElement("span");
        caption.className = "image-credit";
        caption.textContent = c.caption || "AI 教学示意 · 非文物原照";
        visual.appendChild(caption);
        if (c.real) {
          const zoom = document.createElement("button");
          zoom.type = "button"; zoom.className = "photo-open";
          zoom.dataset.photoSrc = c.img; zoom.dataset.photoCaption = c.caption;
          zoom.textContent = "放大观察 ↗";
          visual.appendChild(zoom);
        }
      }
      el.slides.appendChild(s);
    });
    window.SUI_EVIDENCE.bind(el.slides, id => goYear(YEARS.findIndex(y => y.id === id)));
    // dots
    el.dots.innerHTML = "";
    list.forEach((_, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", "第 " + (i + 1) + " 张");
      b.addEventListener("click", () => goCard(i));
      el.dots.appendChild(b);
    });
    ci = 0;
    applyTransform();
    void el.slides.offsetWidth;
    el.slides.style.transition = "";
  }

  function applyTransform() {
    el.slides.style.transform = "translateX(-" + ci * 100 + "%)";
    const list = filtered.length ? filtered : cardsOfYear(yi);
    const y = YEARS[yi];
    el.kicker.textContent = y.label + " · " + y.caption;
    el.count.textContent = (ci + 1) + " / " + list.length;
    el.hint.textContent = list[ci].evidence ? "资料探究 · 地图 / 时序 / 证据" : list[ci].scene ? (list[ci].summary ? "全课回顾" : ci === 0 && yi === 0 ? "全课总览" : "阶段概述") : (el.slides.children[ci].classList.contains("narrative-slide") ? "主线讲述 · " : "深入分析 · ") + (list[ci].tagText || "教材");
    el.cardPrev.disabled = ci <= 0 && yi === 0;
    el.cardNext.disabled = ci >= list.length - 1 && yi === YEARS.length - 1;
    Array.from(el.slides.children).forEach((slide, i) => {
      slide.classList.toggle("is-active", i === ci);
      slide.inert = i !== ci;
      slide.setAttribute("aria-hidden", String(i !== ci));
    });
    Array.from(el.dots.children).forEach((d, i) => d.classList.toggle("on", i === ci));
    updateRail();
  }

  function goCard(i) {
    const list = cardsOfYear(yi);
    ci = Math.max(0, Math.min(list.length - 1, i));
    applyTransform();
  }

  function goYear(i, resetCard) {
    yi = Math.max(0, Math.min(YEARS.length - 1, i));
    if (resetCard !== false) ci = 0;
    renderSlides();
    applyTransform();
    // scroll rail node into view
    const node = railNodes()[yi];
    if (node) node.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function nextCard() {
    const list = cardsOfYear(yi);
    if (ci < list.length - 1) goCard(ci + 1);
    else if (yi < YEARS.length - 1) goYear(yi + 1);
  }
  function prevCard() {
    if (ci > 0) goCard(ci - 1);
    else if (yi > 0) {
      goYear(yi - 1);
      const list = cardsOfYear(yi);
      goCard(list.length - 1);
    }
  }
  function nextYear() { if (yi < YEARS.length - 1) goYear(yi + 1); }
  function prevYear() { if (yi > 0) goYear(yi - 1); }

  /* —— events —— */
  el.cardNext.addEventListener("click", nextCard);
  el.cardPrev.addEventListener("click", prevCard);
  el.yearDown.addEventListener("click", nextYear);
  el.yearUp.addEventListener("click", prevYear);

  // swipe on deck
  const deck = document.querySelector(".deck");
  let tx = 0, ty = 0;
  deck.addEventListener("touchstart", (e) => {
    tx = e.changedTouches[0].clientX;
    ty = e.changedTouches[0].clientY;
  }, { passive: true });
  deck.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) nextCard(); else prevCard();
    }
  }, { passive: true });

  document.addEventListener("keydown", (e) => {
    if (document.getElementById("photoViewer")?.open) return;
    if (el.intro && !el.intro.classList.contains("hide")) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); start(); }
      return;
    }
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === "ArrowRight") { e.preventDefault(); nextCard(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prevCard(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); nextYear(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); prevYear(); }
    else if (e.key >= "1" && e.key <= "9") {
      const i = parseInt(e.key, 10) - 1;
      if (i < YEARS.length) { e.preventDefault(); goYear(i); }
    } else if (e.key === "0") {
      e.preventDefault(); goYear(YEARS.length - 1); // 618 末年
    }
  });

  function start() {
    el.intro.classList.add("hide");
    el.intro.inert = true;
    document.querySelector(".rail").inert = false;
    document.querySelectorAll(".stage-top,.deck,.stage-bottom").forEach(n => n.inert = false);
    document.getElementById("homeBtn").focus();
    goYear(0);
  }
  el.startBtn.addEventListener("click", start);

  document.getElementById("homeBtn").addEventListener("click", () => {
    el.intro.inert = false;
    el.intro.classList.remove("hide");
    document.querySelector(".rail").inert = true;
    document.querySelectorAll(".stage-top,.deck,.stage-bottom").forEach(n => n.inert = true);
    el.startBtn.focus();
  });
  const fullButton = document.getElementById("fullscreenBtn");
  if (!document.fullscreenEnabled) fullButton.hidden = true;
  fullButton.addEventListener("click", async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (_) { fullButton.textContent = "请使用浏览器全屏"; }
  });
  document.addEventListener("fullscreenchange", () => {
    fullButton.textContent = document.fullscreenElement ? "退出全屏 ↙" : "全屏 ↗";
  });
  document.querySelector(".rail").inert = true;
  document.querySelectorAll(".stage-top,.deck,.stage-bottom").forEach(n => n.inert = true);
  /* —— init —— */
  buildRail();
  goYear(0);
})();
</script>
</body>
</html>
