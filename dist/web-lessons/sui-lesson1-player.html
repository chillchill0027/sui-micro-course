<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>隋朝统一与灭亡 · 课堂播放器</title>
<style>
:root {
  --ink: #1d1d1f;
  --muted: #6e6e73;
  --sub: #86868b;
  --blue: #0071e3;
  --blue-soft: #e8f1fc;
  --bg: #f5f5f7;
  --card: #ffffff;
  --line: rgba(0,0,0,.08);
  --rail-w: 112px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  overflow: hidden;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
img { max-width: 100%; display: block; }

.app {
  display: grid;
  grid-template-columns: var(--rail-w) 1fr;
  height: 100vh;
  width: 100vw;
}

/* ========== LEFT RAIL: time + progress ========== */
.rail {
  background: #fff;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0 10px;
  z-index: 5;
  user-select: none;
}
.rail-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  transition: background .15s, opacity .15s;
}
.rail-btn:hover { background: #e8e8ed; }
.rail-btn:disabled { opacity: .3; cursor: default; }
.rail-btn.next-year { background: var(--blue); color: #fff; }
.rail-btn.next-year:hover { background: #0077ED; }
.rail-btn.next-year:disabled { background: #a0c4ef; opacity: 1; }

.rail-track {
  flex: 1;
  width: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px 10px 8px;
  scroll-behavior: smooth;
  scrollbar-width: none;
  position: relative;
}
.rail-track::-webkit-scrollbar { display: none; }

/* spine line */
.rail-track::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 18px; bottom: 18px;
  width: 2px;
  background: #e5e5ea;
  transform: translateX(-50%);
  border-radius: 1px;
  z-index: 0;
}
.rail-fill {
  position: absolute;
  left: 50%;
  top: 18px;
  width: 2px;
  background: var(--blue);
  transform: translateX(-50%);
  border-radius: 1px;
  z-index: 1;
  height: 0;
  transition: height .35s ease;
}

.year-node {
  position: relative;
  z-index: 2;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 0 10px;
  cursor: pointer;
}
.year-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #fff;
  border: 2.5px solid #d2d2d7;
  transition: border-color .2s, transform .2s, background .2s;
  flex-shrink: 0;
}
.year-node.done .year-dot {
  border-color: var(--blue);
  background: var(--blue);
}
.year-node.active .year-dot {
  border-color: var(--blue);
  background: var(--blue);
  transform: scale(1.35);
  box-shadow: 0 0 0 4px rgba(0,113,227,.15);
}
.year-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--sub);
  letter-spacing: -.01em;
  line-height: 1.15;
  text-align: center;
  transition: color .2s;
}
.year-node.active .year-label { color: var(--blue); font-size: 12px; }
.year-node.done .year-label { color: var(--ink); }
/* mini progress bar per year */
.year-bar {
  width: 42px; height: 3px;
  background: #e5e5ea;
  border-radius: 2px;
  overflow: hidden;
}
.year-bar i {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--blue);
  border-radius: 2px;
  transition: width .3s ease;
}
.year-node.done .year-bar i { width: 100%; }
.year-node.active .year-bar i { background: var(--blue); }

.rail-brand {
  font-size: 10px;
  color: var(--sub);
  text-align: center;
  padding: 8px 6px 0;
  line-height: 1.3;
  letter-spacing: .02em;
}

/* ========== STAGE ========== */
.stage {
  position: relative;
  overflow: hidden;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.stage-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px 10px;
  flex-shrink: 0;
}
.stage-kicker {
  font-size: 14px;
  color: var(--blue);
  font-weight: 600;
}
.stage-count {
  font-size: 13px;
  color: var(--sub);
  font-variant-numeric: tabular-nums;
}

.deck {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
  min-height: 0;
}

/* large card slide */
.slides {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform .45s cubic-bezier(.32,.72,0,1);
  will-change: transform;
}
.slide {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  padding: 8px 56px 24px;
  display: flex;
  min-height: 0;
}
@media (max-width: 900px) {
  .slide { padding: 8px 48px 16px; }
}

.big-card {
  background: var(--card);
  border-radius: 28px;
  box-shadow: 0 2px 6px rgba(0,0,0,.04), 0 18px 48px rgba(0,0,0,.08);
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  overflow: hidden;
  min-height: 0;
}
.big-card.no-img {
  grid-template-columns: 1fr;
}
.big-card.has-img-wide {
  grid-template-columns: 1.2fr 0.8fr;
}
@media (max-width: 900px) {
  .big-card, .big-card.has-img-wide {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
  }
  .big-card .visual { min-height: 180px; max-height: 32vh; }
}

.big-card .content {
  padding: 36px 40px 32px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.big-card .content::-webkit-scrollbar { width: 4px; }
.big-card .content::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 2px; }

.tag {
  display: inline-flex;
  align-self: flex-start;
  font-size: 13px;
  font-weight: 500;
  padding: 5px 12px;
  border-radius: 980px;
  margin-bottom: 14px;
  background: var(--bg);
  color: var(--muted);
}
.tag.book { background: var(--blue); color: #fff; }
.tag.extend { background: #424245; color: #f5f5f7; }
.tag.cost { background: #9a4b1f; color: #fff; }

.big-card h2 {
  font-size: clamp(28px, 3.2vw, 40px);
  font-weight: 600;
  letter-spacing: -.025em;
  line-height: 1.15;
  margin: 0 0 8px;
}
.year-chip {
  display: inline-block;
  font-size: 14px;
  font-weight: 600;
  color: var(--blue);
  margin-bottom: 14px;
}
.big-card .body {
  font-size: clamp(16px, 1.35vw, 19px);
  line-height: 1.7;
  color: var(--ink);
  flex: 1;
}
.big-card .body p { margin: 0 0 0.85em; }
.big-card .body p:last-child { margin-bottom: 0; }
.big-card .body strong { font-weight: 600; }
.big-card .note {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 14px;
  color: var(--sub);
  line-height: 1.5;
}

.visual {
  background: #1d1d1f center/cover no-repeat;
  min-height: 0;
  position: relative;
}
.visual::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(0,0,0,.08), transparent 30%);
  pointer-events: none;
}
.big-card.no-img .visual { display: none; }

/* dark card variant */
.big-card.dark {
  background: #1d1d1f;
  color: #f5f5f7;
}
.big-card.dark .body { color: #f5f5f7; }
.big-card.dark .note { color: #86868b; border-top-color: rgba(255,255,255,.12); }
.big-card.dark .tag.extend { background: rgba(255,255,255,.14); }
.big-card.dark .tag { background: rgba(255,255,255,.1); color: #a1a1a6; }

/* side arrows */
.nav-side {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,.92);
  box-shadow: 0 2px 12px rgba(0,0,0,.12);
  font-size: 22px;
  color: var(--ink);
  z-index: 4;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
  transition: opacity .2s, transform .2s;
}
.nav-side:hover { transform: translateY(-50%) scale(1.06); }
.nav-side:disabled { opacity: .3; cursor: default; transform: translateY(-50%); }
.nav-side.prev { left: 8px; }
.nav-side.next { right: 8px; }

/* bottom bar */
.stage-bottom {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 28px 18px;
  gap: 16px;
}
.dots {
  display: flex;
  gap: 6px;
  flex: 1;
  justify-content: center;
  flex-wrap: wrap;
}
.dots button {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #d2d2d7;
  padding: 0;
  transition: width .2s, background .2s, border-radius .2s;
}
.dots button.on {
  width: 22px;
  border-radius: 4px;
  background: var(--ink);
}
.hint {
  font-size: 12px;
  color: var(--sub);
  white-space: nowrap;
}

/* intro overlay */
.intro {
  position: absolute; inset: 0;
  z-index: 20;
  background:
    linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,.55)),
    url("assets/hero-sui-capital.png") center/cover no-repeat;
  color: #f5f5f7;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px;
  transition: opacity .5s, visibility .5s;
}
.intro.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.intro h1 {
  font-size: clamp(40px, 6vw, 72px);
  font-weight: 600;
  letter-spacing: -.03em;
  margin: 0 0 12px;
}
.intro .sub {
  font-size: clamp(18px, 2vw, 24px);
  color: #a1a1a6;
  margin: 0 0 8px;
}
.intro .meta {
  font-size: 14px;
  color: #86868b;
  margin: 0 0 36px;
}
.intro .btn {
  display: inline-flex;
  padding: 14px 32px;
  border-radius: 980px;
  background: var(--blue);
  color: #fff;
  font-size: 18px;
  font-weight: 500;
  box-shadow: 0 4px 20px rgba(0,113,227,.35);
  transition: transform .15s;
}
.intro .btn:hover { transform: scale(1.04); }
.intro .how {
  margin-top: 28px;
  font-size: 13px;
  color: #86868b;
  line-height: 1.6;
}

/* mobile rail collapse */
@media (max-width: 640px) {
  :root { --rail-w: 72px; }
  .year-label { font-size: 10px; }
  .year-bar { width: 28px; }
  .slide { padding: 4px 40px 10px; }
  .big-card .content { padding: 22px 20px; }
}
</style>

<script>
(function () {
  const YEARS = [
    { id: "yIntro", label: "导入", caption: "37年何以影响千年" },
    { id: "y577", label: "577", caption: "北周灭北齐" },
    { id: "y581", label: "581", caption: "隋文帝建隋" },
    { id: "y583", label: "583", caption: "迁都大兴" },
    { id: "y589", label: "589", caption: "灭陈统一" },
    { id: "y604", label: "604", caption: "开皇之治" },
    { id: "y605", label: "605", caption: "炀帝继位" },
    { id: "y607", label: "607", caption: "设进士科" },
    { id: "y610", label: "610", caption: "运河贯通" },
    { id: "y614", label: "614", caption: "三征高句丽" },
    { id: "y615", label: "615", caption: "雁门之围" },
    { id: "y618", label: "618", caption: "炀帝落幕" },
    { id: "ySum", label: "总结", caption: "奇观误国" },
    { id: "yEnd", label: "结束", caption: "课后讨论" }
  ];

  /** cards: each is nearly a full teaching page */
  const CARDS = [
    {
      year: "yIntro", tag: "book", tagText: "导入",
      title: "37 年的王朝，何以影响千年？", yearLine: "581—618 年",
      img: "assets/hero-sui-capital.png", wide: true,
      body: `<p>隋朝只存在 37 年，却结束了长期分裂，留下大运河、科举和律令等制度遗产。</p><p>接下来沿着时间线追问：<strong>一个王朝如何迅速完成统一，又为何迅速走向崩解？</strong></p>`
    },
    {
      year: "y577",
      tag: "map", tagText: "地图演示",
      title: "577 · 北周吞并北齐",
      yearLine: "577 年",
      evidence: "unifyMap",
      unifyStep: "577"
    },
    {
      year: "y577",
      tag: "extend", tagText: "拓展",
      title: "北方一体意味着什么",
      yearLine: "统一前夜",
      img: "assets/north-unification-577.png", wide: true,
      body: `<p><strong>战争过程：</strong>575 年北周武帝开始大举进攻北齐；576 年攻取晋阳，次年进入邺城，北齐灭亡。北方长期东西对峙的军事格局由此结束。</p>
      <p><strong>资源变化：</strong>北齐控制的河北、山东等人口稠密地区，以及粮赋、军队和工匠，都被纳入北周。此后北方可以把分散的兵力与财政集中起来。</p>
      <p><strong>政治基础：</strong>杨坚所在的关陇集团掌握府兵与官僚网络。581 年建隋并非从零起家，而是继承了北周已经整合的北方国家机器。</p>
      <p><strong>历史转折：</strong>北方一体化缩小了南北实力差距，也为隋在 589 年渡江灭陈创造了兵员、粮饷和组织条件。</p>`
    },
    {
      year: "y581",
      tag: "map", tagText: "地图演示",
      title: "581 · 隋文帝建立隋朝",
      yearLine: "581 年",
      evidence: "unifyMap",
      unifyStep: "581"
    },
    {
      year: "y583",
      tag: "map", tagText: "地图演示",
      title: "583 · 迁都大兴城",
      yearLine: "583 年",
      evidence: "unifyMap",
      unifyStep: "583"
    },
    {
      year: "y589",
      tag: "map", tagText: "地图演示",
      title: "589 · 过长江统一陈朝",
      yearLine: "589 年",
      evidence: "unifyMap",
      unifyStep: "589"
    },
    {
      year: "y605",
      tag: "extend", tagText: "拓展",
      title: "宫廷斗争与统治心理",
      yearLine: "604–605",
      img: "assets/yang-guang-court-605.png", wide: true,
      body: `<p><strong>储位之争：</strong>杨广原为晋王，兄长杨勇是太子。杨勇生活奢华、失去独孤皇后支持；杨广则刻意表现俭朴、孝谨，并与重臣杨素结交。600 年，杨勇被废，杨广被立为太子。</p>
      <p><strong>继位疑云：</strong>604 年隋文帝病逝于仁寿宫，杨广即位。关于文帝死因及杨广是否矫诏，正史记载与后世叙述互有差异，不能把传闻直接当作确定事实。</p>
      <p><strong>统治性格：</strong>他有强烈的功业冲动，追求在短时间内完成东都、运河、巡游与对外战争，以可见的宏大工程证明皇权与帝国力量。</p>
      <p><strong>致命缺陷：</strong>目标本身并非都无价值，问题在于缺少节制与反馈。当成本不断落到编户百姓身上，他仍持续追加工程和战争，最终把国家动员能力变成社会崩解的压力。</p>`
    },
    {
      year: "y607",
      tag: "book", tagText: "进士科",
      title: "进士科：以时务策取士",
      yearLine: "进士科",
      body: `<p><strong>考什么：</strong>隋代进士科早期以<strong>时务策</strong>等考问为主。考题围绕现实政务，要求考生分析形势、提出治理办法，朝廷借此观察见识与表达能力。</p>
      <p><strong>怎样考：</strong>隋代制度仍在草创，科目、程序和录取规模都远不如唐宋。唐代才逐渐发展出更稳定的明经、进士等科目，以及经义、诗赋、策论等考试内容。</p>
      <p><strong>为何重要：</strong>策问让政治见解成为可以比较的文字成果。门第依然影响仕途，但出身不再是唯一入口，中央也取得了更直接的选官工具。</p>
      <p>因此，607 年的意义不在于一夜建成成熟考试体系，而在于确立了“按科考试、以才取人”的制度方向。</p>`
    },
    {
      year: "ySum",
      tag: "book", tagText: "总结",
      title: "何以暴政速亡，奇观误国",
      yearLine: "总结",
      body: `<p><strong>暴政速亡</strong>：不是没有能力，而是拒绝收缩——高动员、短反馈、民力透支。<br/>
      <strong>奇观误国</strong>：不是运河本身有罪，而是把通道变成无止境的展示与征发。</p>
      <p>遗产仍在：统一、科举、运河、律令，被唐继承。</p>`
    },
    {
      year: "yEnd",
      tag: "book", tagText: "讨论",

    }
    if (id === "y610") {
      const order = ["开通大运河", "四段河道", "为何是南北走向", "漕运与转漕", "营建东都洛阳", "两下江南：605 与 610", "多次巡游与龙舟仪仗", "修筑长城和驰道", "皮日休如何评价运河"];
      const ordered = order.map(title => details.find(card => card.title === title)).filter(Boolean);
      const canal = extra.find(card => card.evidence === "canal");
      return [ordered[0], canal, ...ordered.slice(1), ...extra.filter(card => card !== canal)].filter(Boolean);
    }
    if (id === "y614") return [details.find(card => card.title === "三次征辽东"), extra[0], ...details.filter(card => card.title !== "三次征辽东")].filter(Boolean);
    return details;
  }

  function cardIndexInYear() {
    const list = cardsOfYear(yi);
    // ci is index within current year
    return Math.min(ci, Math.max(0, list.length - 1));
  }

  function renderSlides() {
    const list = cardsOfYear(yi);
    filtered = list;
    el.slides.style.transition = "none";
    el.slides.innerHTML = "";
    list.forEach((c, i) => {
      const s = document.createElement("section");
      s.className = "slide";
      s.dataset.i = String(i);
      s.style.setProperty("--chapter-year", '"' + YEARS[yi].label + '"');
      const tagCls = c.tag || "book";
      const cardCls = "big-card" + (c.img ? (c.wide ? " has-img-wide" : "") : " no-img") + (c.dark ? " dark" : "");
      s.innerHTML =
        '<article class="' + cardCls + '">' +
          (c.img
            ? '<div class="visual" style="background-image:url(\'' + c.img + '\')"></div>'
            : '<div class="visual"></div>') +
          '<div class="content">' +
            '<span class="tag ' + tagCls + '">' + (c.tagText || "教材") + "</span>" +
            '<span class="year-chip">' + (c.yearLine || YEARS[yi].caption) + "</span>" +
            "<h2>" + c.title + "</h2>" +
            '<div class="body">' + c.body + "</div>" +
          "</div>" +
        "</article>";
      const narrativeTitles = ["杨坚代周建隋", "营建并迁都大兴城", "渡江灭陈，全国一统", "开皇之治：国力迅速恢复", "开通大运河", "开创科举取士制度", "经略流求（台湾）", "三次征辽东", "618 年隋亡"];
      if (narrativeTitles.includes(c.title)) {
        s.classList.add("narrative-slide");
        s.querySelector("article").classList.add("narrative-page");
      }
      if (c.scene) {
        s.classList.add("scene-slide");
        s.innerHTML = sceneMarkup(c);
      }
      if (c.evidence) {
        s.classList.add("evidence-slide");
        if (c.evidence === "unifyMap") {
          s.innerHTML = window.SUI_EVIDENCE.unifyMap(c.unifyStep || "577");
        } else {
          s.innerHTML = window.SUI_EVIDENCE.render(c.evidence);
        }
      }
      if (c.img) {
        const visual = s.querySelector(".visual");
        visual.setAttribute("role", c.real ? "group" : "img");
        visual.setAttribute("aria-label", c.caption || c.title + " · AI教学示意");
        visual.classList.toggle("real-photo", !!c.real);
        visual.classList.toggle("contain-photo", !!c.contain);
        const caption = document.createElement("span");
        caption.className = "image-credit";
        caption.textContent = c.caption || "AI 教学示意 · 非文物原照";
        visual.appendChild(caption);
        if (c.real) {
          const zoom = document.createElement("button");
          zoom.type = "button"; zoom.className = "photo-open";
          zoom.dataset.photoSrc = c.img; zoom.dataset.photoCaption = c.caption;
          zoom.textContent = "放大观察 ↗";
          visual.appendChild(zoom);
        }
      }
      el.slides.appendChild(s);
    });
    window.SUI_EVIDENCE.bind(el.slides, id => goYear(YEARS.findIndex(y => y.id === id)));
    // dots
    el.dots.innerHTML = "";
    list.forEach((_, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", "第 " + (i + 1) + " 张");
      b.addEventListener("click", () => goCard(i));
      el.dots.appendChild(b);
    });
    ci = 0;
    applyTransform();
    void el.slides.offsetWidth;
    el.slides.style.transition = "";
  }

  function applyTransform() {
    el.slides.style.transform = "translateX(-" + ci * 100 + "%)";
    const list = filtered.length ? filtered : cardsOfYear(yi);
    const y = YEARS[yi];
    el.kicker.textContent = y.label + " · " + y.caption;
    el.count.textContent = (ci + 1) + " / " + list.length;
    el.hint.textContent = list[ci].evidence === "unifyMap" ? "地图演示" : list[ci].evidence ? "史料与证据" : list[ci].scene ? "总结" : (list[ci].tagText || "课程内容");
    el.cardPrev.disabled = ci <= 0 && yi === 0;
    el.cardNext.disabled = ci >= list.length - 1 && yi === YEARS.length - 1;
    Array.from(el.slides.children).forEach((slide, i) => {
      slide.classList.toggle("is-active", i === ci);
      slide.inert = i !== ci;
      slide.setAttribute("aria-hidden", String(i !== ci));
    });
    Array.from(el.dots.children).forEach((d, i) => d.classList.toggle("on", i === ci));
    updateRail();
  }

  function goCard(i) {
    const list = cardsOfYear(yi);
    ci = Math.max(0, Math.min(list.length - 1, i));
    applyTransform();
  }

  function goYear(i, resetCard) {
    yi = Math.max(0, Math.min(YEARS.length - 1, i));
    if (resetCard !== false) ci = 0;
    renderSlides();
    applyTransform();
    // scroll rail node into view
    const node = railNodes()[yi];
    if (node) node.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function nextCard() {
    const list = cardsOfYear(yi);
    if (ci < list.length - 1) goCard(ci + 1);
    else if (yi < YEARS.length - 1) goYear(yi + 1);
  }
  function prevCard() {
    if (ci > 0) goCard(ci - 1);
    else if (yi > 0) {
      goYear(yi - 1);
      const list = cardsOfYear(yi);
      goCard(list.length - 1);
    }
  }
  function nextYear() { if (yi < YEARS.length - 1) goYear(yi + 1); }
  function prevYear() { if (yi > 0) goYear(yi - 1); }

  /* —— events —— */
  el.cardNext.addEventListener("click", nextCard);
  el.cardPrev.addEventListener("click", prevCard);
  el.yearDown.addEventListener("click", nextYear);
  el.yearUp.addEventListener("click", prevYear);

  // swipe on deck
  const deck = document.querySelector(".deck");
  let tx = 0, ty = 0;
  deck.addEventListener("touchstart", (e) => {
    tx = e.changedTouches[0].clientX;
    ty = e.changedTouches[0].clientY;
  }, { passive: true });
  deck.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) nextCard(); else prevCard();
    }
  }, { passive: true });

  document.addEventListener("keydown", (e) => {
    if (document.getElementById("photoViewer")?.open) return;
    if (el.intro && !el.intro.classList.contains("hide")) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); start(); }
      return;
    }
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === "ArrowRight") { e.preventDefault(); nextCard(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prevCard(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); nextYear(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); prevYear(); }
    else if (e.key >= "1" && e.key <= "9") {
      const i = parseInt(e.key, 10) - 1;
      if (i < YEARS.length) { e.preventDefault(); goYear(i); }
    } else if (e.key === "0") {
      e.preventDefault(); goYear(YEARS.length - 1); // 618 末年
    }
  });

  function start() {
    el.intro.classList.add("hide");
    el.intro.inert = true;
    document.querySelector(".rail").inert = false;
    document.querySelectorAll(".stage-top,.deck,.stage-bottom").forEach(n => n.inert = false);
    document.getElementById("homeBtn").focus();
    goYear(0);
  }
  el.startBtn.addEventListener("click", start);

  document.getElementById("homeBtn").addEventListener("click", () => {
    el.intro.inert = false;
    el.intro.classList.remove("hide");
    document.querySelector(".rail").inert = true;
    document.querySelectorAll(".stage-top,.deck,.stage-bottom").forEach(n => n.inert = true);
    el.startBtn.focus();
  });
  const fullButton = document.getElementById("fullscreenBtn");
  if (!document.fullscreenEnabled) fullButton.hidden = true;
  fullButton.addEventListener("click", async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (_) { fullButton.textContent = "请使用浏览器全屏"; }
  });
  document.addEventListener("fullscreenchange", () => {
    fullButton.textContent = document.fullscreenElement ? "退出全屏 ↙" : "全屏 ↗";
  });
  document.querySelector(".rail").inert = true;
  document.querySelectorAll(".stage-top,.deck,.stage-bottom").forEach(n => n.inert = true);
  /* —— init —— */
  buildRail();
  goYear(0);
})();
</script>
</body>
</html>
